# Custode - proxy TLS per la rete locale (container custode-lan).
# Installato da configura.sh in ~custode/lan/conf.d/, che il container
# monta su /etc/nginx/conf.d. La porta 80 non è pubblicata: nessun redirect.

server {
    listen 443 ssl;
    http2 on;
    # Nome e indirizzo li decide il certificato, non questo file.
    server_name _;

    ssl_certificate /etc/nginx/certs/custode.crt;
    ssl_certificate_key /etc/nginx/certs/custode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Lo stesso limite dell'app (MAX_CONTENT_LENGTH, 32 MB).
    client_max_body_size 32m;

    # Niente HSTS: con un certificato interno, un errore di rinnovo
    # chiuderebbe fuori i browser fino alla scadenza dell'intestazione.

    location / {
        # L'app è nello stesso pod: stesso localhost.
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'app si fida di un solo salto: qui si scrive ciò che nginx ha
        # visto, senza accodare al valore mandato dal client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
