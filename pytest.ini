[pytest]
# Il default di pytest ("test" come prefisso nudo) raccoglie come test anche
# funzioni come testo_sicuro() e testo_di() solo perche' iniziano per "test":
# vengono marcate ERROR perche' i loro argomenti non sono fixture. Restringere
# al prefisso convenzionale "test_" evita falsi positivi senza toccare i nomi
# di funzione richiesti dalla specifica.
python_files = test_*.py
python_functions = test_*
