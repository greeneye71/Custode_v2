<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleziona Struttura — MedInventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-building fs-1 text-primary"></i>
                <h4 class="mt-2">Seleziona Struttura</h4>
                <p class="text-muted small">Scegli la struttura su cui vuoi lavorare.</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <div class="list-group">
                {% for s in strutture %}
                <form method="post" action="{{ url_for('auth.tecnico_seleziona_struttura', struttura_id=s.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit"
                            class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 w-100 text-start">
                        <i class="bi bi-building text-primary fs-5"></i>
                        <span class="fw-medium">{{ s.nome }}</span>
                        <i class="bi bi-chevron-right ms-auto text-muted"></i>
                    </button>
                </form>
                {% endfor %}
            </div>
            <div class="text-center mt-3">
                <form method="post" action="{{ url_for('auth.logout') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-link text-muted small text-decoration-none p-0">
                        <i class="bi bi-box-arrow-right me-1"></i>Esci
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
