<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errore {{ code }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .error-box { max-width: 480px; margin: 10vh auto; text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; font-weight: 700; color: #dee2e6; line-height: 1; }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">{{ code }}</div>
        <h4 class="mt-2 mb-1">{{ title }}</h4>
        <p class="text-muted mb-4">{{ message }}</p>
        <a href="/" class="btn btn-primary">
            <i class="bi bi-house"></i> Torna alla home
        </a>
    </div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</body>
</html>
